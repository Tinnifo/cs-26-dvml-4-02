# @package _global_
#
# Full GNN sweep: every standard backbone × {vanilla, iceberg} × every dataset.
# CG3 is excluded (it bundles its own architecture and is not a GNN backbone).
#
# Two passes, one per label strategy. Hydra's basic sweeper does cartesian
# products and cannot couple budget ranges to the chosen strategy, so the
# percentage budgets are passed on the CLI in pass 2.
#
# Pass 1 — labels-per-class budgets:
#   python src/train.py --multirun +experiment=gnn_full_sweep
#
# Pass 2 — percentage budgets:
#   python src/train.py --multirun +experiment=gnn_full_sweep \
#       label_strategy=percentage \
#       label_strategy.budget=0.005,0.01,0.02,0.03,0.05

defaults:
  - override /model: gcn
  - override /method: vanilla
  - override /dataset: cora
  - override /label_strategy: per_class

hydra:
  mode: MULTIRUN
  sweeper:
    params:
      model: gcn,gat,gin,sage,gt,diff
      method: vanilla,iceberg
      dataset: cora,citeseer,pubmed
      label_strategy.budget: 1,3,5,10,20

tensorboard:
  enable: true
