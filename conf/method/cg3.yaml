# CG3 owns its model + multi-task loss. `cfg.model` is ignored — pair this
# method with `model=cg3` for clarity.
#
# Two architecture knobs select one of the four combinations from the
# snapshot/86b0818 reference (CG3Method/main.py):
#   local_model:  gcn | gat   (the local two-layer classifier)
#   global_model: hgcn | hgat (the hierarchical global view)
#
# Defaults match snapshot's hyperparameters exactly:
#   hidden_local=1024, hidden_global=32, dropout=0.6, lr=0.005, wd=5e-4,
#   coarsen_level=4, channel_num=4, max_node_wgt=50, node_wgt_embed_dim=5.
# The optimizer's weight_decay is forced to 0 because the model adds the
# L2 term to its own loss — `weight_decay` here only configures that term.
name: cg3

# architecture
local_model: gcn          # gcn | gat
global_model: hgcn        # hgcn | hgat

# optimization
lr: 0.01
epochs: 1000
weight_decay: 5e-4        # manual L2 term inside model loss
optimizer_weight_decay: 0.0

dropout: 0.6

# hidden sizes
hidden_local: 1024
hidden_global: 32

# hierarchical graph params
coarsen_level: 4
max_node_wgt: 50
channel_num: 4
node_wgt_embed_dim: 5

# training
use_early_stopping: false
select_best_by: val_acc
patience: 9999
